[tool.poetry]
name = "eodhd-ez"
version = "0.1.0"
description = ""
authors = ["tyler-austin <tyler.e.austin@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.15,<4.0"
pandas = "^3.1.1"
bokeh = "^3.10.2"
eodhd = "^1.0.32"
plotly = "^7.1.0"
matplotlib = "^3.11.2"
mplfinance = "^0.12.10b0"
mplchart = "^0.0.56"
toolz = "^1.2.0"
inflection = "^0.5.1"
openpyxl = "^3.1.5"
backoff = "^2.2.1"
ratelimit = "^2.2.1"
python-dotenv = "^1.2.4"
requests-cache = "^1.3.3"
colorlog = "^6.12.0"

redis = "^8.1.0"
gics = "^0.2.1"
numpy = "^2.5.4"
datamodel-code-generator = "^0.96.0"
ta-lib = "^0.8.3"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
poethepoet = "^0.49.0"
ruff = "^0.17.5"

[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb", "**/*.toml"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks.lint]
help = "Check codebase for linting and formatting errors"
cmd = "ruff check ${path} --config ${config} ${fix}"

[[tool.poe.tasks.lint.args]]
name = "path"
help = "Path to the codebase"
type = "string"
default = "."
positional = true
required = false

[[tool.poe.tasks.lint.args]]
name = "config"
help = "Path to the ruff config file"
options = ["-c", "--config"]
type = "string"
default = ".ruff.toml"
required = false
